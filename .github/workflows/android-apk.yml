name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lockb"
      - "resources/**"
      - "src/components/AppSplash.tsx"
      - "src/lib/native-bluetooth.ts"
      - "src/lib/bt-printer.ts"
      - "src/lib/print-receipt.ts"
      - "src/lib/biometric-auth.ts"
      - "src/lib/native-oauth.ts"
      - "src/routes/auth.native.tsx"
      - "src/components/auth/**"
      - "src/routes/login.tsx"
      - "src/routes/signup.tsx"
      - "src/routes/app.tsx"
      - "src/routes/app.settings.tsx"
      - "src/routes/__root.tsx"
      - "public/sw.js"
      - "src/routes/app.printer.tsx"
      - "android-shell/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write
  actions: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash screen
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/assets@3
          npx capacitor-assets generate --android --assetPath resources \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          ls android/app/src/main/res/mipmap-xxxhdpi/ || true
          ls android/app/src/main/res/drawable/ || true

      - name: Force white Android 12 splash background
        run: |
          COLORS=android/app/src/main/res/values/colors.xml
          if [ -f "$COLORS" ]; then
            grep -q 'splash_background' "$COLORS" || \
              perl -0pi -e 's|</resources>|    <color name="splash_background">#FFFFFFFF</color>\n</resources>|' "$COLORS"
          fi


      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add deep link scheme (sahlapos://)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "sahlapos" "$MANIFEST"; then
            perl -0pi -e 's|</activity>|    <intent-filter android:autoVerify="true">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="sahlapos" android:host="auth" />\n            </intent-filter>\n        </activity>|' "$MANIFEST"
          fi
          grep -q 'android:scheme="sahlapos"' "$MANIFEST" || {
            echo "Native OAuth deep link was not added to AndroidManifest.xml"
            exit 1
          }

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build release AAB (Google Play)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Sign AAB for Google Play
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured — skipping signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          BUNDLE=android/app/build/outputs/bundle/release/app-release.aab
          UNSIGNED=android/app/build/outputs/bundle/release/app-release-unsigned.aab
          [ -f "$BUNDLE" ] || BUNDLE="$UNSIGNED"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$BUNDLE" "$KEY_ALIAS"
          cp "$BUNDLE" android/app/build/outputs/bundle/release/SAHLAPOS-play.aab

      # تجميع كل المخرجات في مجلد واحد باسم واضح
      - name: Collect release files
        id: pack
        run: |
          mkdir -p release-files
          VER=$(date -u +'%Y.%m.%d-%H%M')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] && cp "$APK" "release-files/SAHLAPOS-$VER.apk"
          for f in android/app/build/outputs/bundle/release/*.aab; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              SAHLAPOS-play.aab) cp "$f" "release-files/SAHLAPOS-$VER-play.aab" ;;
              *) cp "$f" "release-files/SAHLAPOS-$VER-$(basename "$f")" ;;
            esac
          done
          ls -lh release-files

      # تحرير مساحة التخزين: حذف كل مخرجات البناء القديمة (Artifacts)
      - name: Free artifact storage (delete all artifacts)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate -X GET "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' \
            | while read -r id; do
                echo "deleting artifact $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
              done

      # لا نرفع Artifacts إطلاقاً — كل الملفات تُنشر في Releases (لا حصة تخزين)


      # نشر كل شيء في Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.version }}
          name: SAHLAPOS v${{ steps.pack.outputs.version }}
          body: |
            إصدار SAHLAPOS الجاهز للتنزيل.

            - `SAHLAPOS-*.apk` — للتثبيت المباشر على الهاتف (اختبار).
            - `SAHLAPOS-*-play.aab` — للرفع على Google Play Console (موقّع إن توفّرت مفاتيح التوقيع).

            التطبيق يفتح مباشرة على https://pos.sahlapay.dz/login
          files: release-files/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

