name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lockb"
      - "src/lib/native-bluetooth.ts"
      - "src/lib/bt-printer.ts"
      - "src/lib/biometric-auth.ts"
      - "src/lib/native-oauth.ts"
      - "src/routes/auth.native.tsx"
      - "src/components/auth/**"
      - "src/routes/login.tsx"
      - "src/routes/signup.tsx"
      - "src/routes/app.tsx"
      - "src/routes/app.settings.tsx"
      - "src/routes/__root.tsx"
      - "public/sw.js"
      - "src/routes/app.printer.tsx"
      - "android-shell/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add deep link scheme (sahlapos://)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "sahlapos" "$MANIFEST"; then
            perl -0pi -e 's|</activity>|    <intent-filter android:autoVerify="true">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="sahlapos" android:host="auth" />\n            </intent-filter>\n        </activity>|' "$MANIFEST"
          fi
          grep -q 'android:scheme="sahlapos"' "$MANIFEST" || {
            echo "Native OAuth deep link was not added to AndroidManifest.xml"
            exit 1
          }

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAHLAPOS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
