name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lockb"
      - "resources/**"
      - "src/components/AppSplash.tsx"
      - "src/lib/native-bluetooth.ts"
      - "src/lib/bt-printer.ts"
      - "src/lib/printer-config.ts"
      - "src/lib/print-receipt.ts"

      - "src/lib/biometric-auth.ts"
      - "src/lib/native-oauth.ts"
      - "src/routes/auth.native.tsx"
      - "src/components/auth/**"
      - "src/routes/login.tsx"
      - "src/routes/signup.tsx"
      - "src/routes/app.tsx"
      - "src/routes/app.settings.tsx"
      - "src/routes/__root.tsx"
      - "public/sw.js"
      - "src/routes/app.printer.tsx"
      - "android-shell/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write
  actions: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash screen
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/assets@3
          npx capacitor-assets generate --android --assetPath resources \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          ls android/app/src/main/res/mipmap-xxxhdpi/ || true
          ls android/app/src/main/res/drawable/ || true

      - name: Force white Android 12 splash background
        run: |
          COLORS=android/app/src/main/res/values/colors.xml
          if [ -f "$COLORS" ]; then
            grep -q 'splash_background' "$COLORS" || \
              perl -0pi -e 's|</resources>|    <color name="splash_background">#FFFFFFFF</color>\n</resources>|' "$COLORS"
          fi


      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump versionCode / versionName (Google Play)
        run: |
          GRADLE=android/app/build.gradle
          VCODE=$(( 1000 + ${{ github.run_number }} ))
          VNAME="1.$(( ${{ github.run_number }} )).0"
          perl -0pi -e "s/versionCode \\d+/versionCode $VCODE/" "$GRADLE"
          perl -0pi -e "s/versionName \"[^\"]*\"/versionName \"$VNAME\"/" "$GRADLE"
          grep -E 'versionCode|versionName' "$GRADLE"



      - name: Add deep link scheme (sahlapos://)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "sahlapos" "$MANIFEST"; then
            perl -0pi -e 's|</activity>|    <intent-filter android:autoVerify="true">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="sahlapos" android:host="auth" />\n            </intent-filter>\n        </activity>|' "$MANIFEST"
          fi
          grep -q 'android:scheme="sahlapos"' "$MANIFEST" || {
            echo "Native OAuth deep link was not added to AndroidManifest.xml"
            exit 1
          }

      - name: Configure Gradle mirrors & retries (fix HTTP 429)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          def mirrors = { org.gradle.api.artifacts.dsl.RepositoryHandler handler ->
            handler.clear()
            handler.google()
            handler.maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
            handler.mavenCentral()
            handler.gradlePluginPortal()
          }
          settingsEvaluated { settings ->
            mirrors(settings.pluginManagement.repositories)
            try { mirrors(settings.dependencyResolutionManagement.repositories) } catch (ignored) {}
          }
          allprojects { project -> project.repositories.all {}; mirrors(project.repositories) }
          EOF
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.internal.repository.max.retries=8
          org.gradle.internal.repository.initial.backoff=2000
          org.gradle.internal.repository.max.tentatives=8
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "محاولة $i فشلت — إعادة المحاولة بعد 60 ثانية"
            sleep 60
          done
          exit 1

      - name: Build release AAB (Google Play)
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew bundleRelease --no-daemon && exit 0
            echo "محاولة $i فشلت — إعادة المحاولة بعد 60 ثانية"
            sleep 60
          done
          exit 1


      - name: Sign AAB for Google Play
        id: sign_aab
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p release-files
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            STOREPASS="$KEYSTORE_PASSWORD"
            KEYPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:-sahlapos}"
          else
            echo "::warning::لا توجد مفاتيح توقيع Google Play؛ سيتم نشر APK فقط وتخطي AAB."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            rm -f android/app/build/outputs/bundle/release/*.aab
            exit 0
          fi
          BUNDLE=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$BUNDLE" ] || BUNDLE=android/app/build/outputs/bundle/release/app-release-unsigned.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/release.keystore \
            -storepass "$STOREPASS" -keypass "$KEYPASS" \
            "$BUNDLE" "$ALIAS"
          jarsigner -verify "$BUNDLE"
          echo "--- بصمة مفتاح التوقيع المستخدم (يجب أن تطابق ما ينتظره Google Play) ---"
          keytool -list -v -keystore /tmp/release.keystore -alias "$ALIAS" \
            -storepass "$STOREPASS" | grep -i "SHA1:" || true

          cp "$BUNDLE" android/app/build/outputs/bundle/release/SAHLAPOS-play.aab
          rm -f android/app/build/outputs/bundle/release/app-release.aab \
                android/app/build/outputs/bundle/release/app-release-unsigned.aab
          echo "signed=true" >> "$GITHUB_OUTPUT"


      # تجميع كل المخرجات في مجلد واحد باسم واضح
      - name: Collect release files
        id: pack
        run: |
          mkdir -p release-files
          VER=$(date -u +'%Y.%m.%d-%H%M')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] && cp "$APK" "release-files/SAHLAPOS-$VER.apk"
          for f in android/app/build/outputs/bundle/release/*.aab; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              SAHLAPOS-play.aab) cp "$f" "release-files/SAHLAPOS-$VER-play.aab" ;;
              *) cp "$f" "release-files/SAHLAPOS-$VER-$(basename "$f")" ;;
            esac
          done
          ls -lh release-files

      # تحرير مساحة التخزين: حذف كل مخرجات البناء القديمة (Artifacts)
      - name: Free artifact storage (delete all artifacts)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate -X GET "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' \
            | while read -r id; do
                echo "deleting artifact $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
              done

      # لا نرفع Artifacts إطلاقاً — كل الملفات تُنشر في Releases (لا حصة تخزين)


      # نشر كل شيء في Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.version }}
          name: SAHLAPOS v${{ steps.pack.outputs.version }}
          body: |
            إصدار SAHLAPOS الجاهز للتنزيل.

            - `SAHLAPOS-*.apk` — للتثبيت المباشر على الهاتف (اختبار).
             - `SAHLAPOS-*-play.aab` — يظهر فقط عند توفر مفاتيح التوقيع، وهو جاهز للرفع على Google Play Console.

            التطبيق يفتح مباشرة على https://pos.sahlapay.dz/login
          files: release-files/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

